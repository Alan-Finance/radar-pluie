name: Radar Météo-France

on:
  workflow_dispatch:          # lancé toutes les 10 minutes par cron-job.org (et bouton « Run workflow » à la main)
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          mkdir -p site
          cp index.html sw.js manifest.webmanifest icon-v2.svg icon-v2-192.png icon-v2-512.png config.json site/ && cp -r ciel site/

      - name: Récupérer les données Météo-France et fabriquer les images
        env:
          METEOFRANCE_KEY: ${{ secrets.METEOFRANCE_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          OUT_DIR: site
        run: python scripts/update.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub ne retrouve parfois pas l'archive juste après l'envoi : on réessaie une fois avant d'échouer.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
