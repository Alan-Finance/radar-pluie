name: Radar Météo-France

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest icon.svg site/

      - name: Récupérer les données Météo-France et fabriquer les images
        env:
          METEOFRANCE_KEY: ${{ secrets.METEOFRANCE_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          OUT_DIR: site
        run: python scripts/update.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
